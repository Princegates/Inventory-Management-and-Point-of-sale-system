# Render Blueprint for the API service. Deploy via Render's "New +" -> "Blueprint" and point it
# at this repo, or run `render blueprint launch`. The database itself is NOT provisioned here -
# this project uses Supabase Postgres; set DATABASE_URL below to the Supabase connection string.
services:
  - type: web
    name: ims-pos-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # paste the Supabase connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false # your Netlify site URL, e.g. https://your-site.netlify.app
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
